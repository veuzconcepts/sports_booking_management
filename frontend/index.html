<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Admin panel is private - never index or follow any of its pages
         (covers the login page and every in-app route of this SPA). -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="googlebot" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#201b50" />
    <title>Club & Facility Booking Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- The remembered language, applied before anything renders. React picks
         the same value up on mount and confirms it against the server; this
         only stops the page being laid out in the wrong direction first. -->
    <script>
      (function () {
        try {
          var code = localStorage.getItem('ui_language');
          if (!code) return;
          var dir = localStorage.getItem('ui_language_dir') === 'rtl' ? 'rtl' : 'ltr';
          var root = document.documentElement;
          root.setAttribute('lang', code);
          root.setAttribute('dir', dir);
          if (dir === 'rtl') root.classList.add('is-rtl');
        } catch (e) {
          /* private mode or blocked storage: the default direction stands */
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
