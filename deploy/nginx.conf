# =============================================================================
# Club Booking reverse proxy - two public origins, Django + Astro kept internal.
# =============================================================================
#   admin.example.com  -> this SPA + /api proxied to Django (127.0.0.1:8000)
#   www.example.com     -> Astro SSR website (127.0.0.1:4321), which itself
#                          proxies its /api/* to Django server-side.
# Django and the Astro node bind to localhost only; nginx is the sole public
# entry point, so the REST API host/topology is never exposed.
#
# Django environment for THIS topology (see backend/.env.example):
#   BEHIND_TLS_PROXY=True
#   NUM_PROXIES=1                      # so the login/throttle keys on the real client IP
#   DJANGO_ALLOWED_HOSTS=admin.example.com,www.example.com
#   CSRF_TRUSTED_ORIGINS=https://admin.example.com
#   # CORS_ALLOWED_ORIGINS is NOT needed (SPA is same-origin; website proxies server-side).
#
# Paths assume the git checkout at /opt/clubbooking (built in place). Replace the
# example hostnames and the cert paths for your deployment.
# =============================================================================

upstream clubbooking_api {
    server 127.0.0.1:8000;      # Django (gunicorn), internal only
    keepalive 32;
}

upstream clubbooking_website {
    server 127.0.0.1:4321;      # Astro SSR node, internal only
    keepalive 16;
}

# --- HTTP -> HTTPS -----------------------------------------------------------
server {
    listen 80;
    server_name admin.example.com;
    return 301 https://$host$request_uri;
}

# --- HTTPS: SPA + API --------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name admin.example.com;

    ssl_certificate     /etc/ssl/clubbooking/fullchain.pem;
    ssl_certificate_key /etc/ssl/clubbooking/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 15m;   # branding / logo uploads
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /opt/clubbooking/frontend/dist;   # output of `npm --prefix frontend run build`
    index index.html;

    # ---- SPA shell + security headers ---------------------------------------
    # NOTE on nginx: `add_header` at a location REPLACES (does not merge) inherited
    # headers, so the full security set is listed here where the HTML document is
    # served. Other locations that serve non-HTML assets set only what they need.
    location / {
        try_files $uri /index.html;

        # index.html must never be cached, so a new deploy is picked up at once
        # (the hashed /assets/ files below are immutable and long-cached).
        location = /index.html { expires -1; }

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()" always;

        # ---- SPA Content-Security-Policy ------------------------------------
        # Tuned for THIS app: Google Maps JS (script/img/connect to *.googleapis /
        # *.gstatic), data:/blob: image uploads, and React inline styles.
        #
        # Rolled out as REPORT-ONLY: open the app, confirm ZERO violations in the
        # browser console, THEN rename the header to `Content-Security-Policy`
        # (drop `-Report-Only`) to ENFORCE.
        #
        # If Google Maps logs a CSP error, it may need `'unsafe-eval'` added to
        # script-src on some Maps builds - add it only if a violation shows it.
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://maps.googleapis.com; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    # Content-hashed build assets are immutable - cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---- REST API -> Django (internal only) ---------------------------------
    location /api/ {
        proxy_pass http://clubbooking_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # PINNED, not passed through. nginx forwards any header it does not
        # set itself, so without these a visitor could send their own
        # `X-Forwarded-Host: evil.example` and have the application believe it.
        # That is the way in for host-header reflection, cache poisoning and
        # the SSRF-in-error-rendering class of bug: the app builds a URL from
        # a header the attacker chose. Overriding them costs nothing and closes
        # the whole family whatever the framework does with the value.
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Forwarded-Port   $server_port;
        proxy_set_header Connection        "";
        # Django emits its own strict API CSP + Permissions-Policy/COOP on these
        # responses (config.security_headers.SecurityHeadersMiddleware), so nginx
        # deliberately adds no header here (avoids duplicate/among-conflicting CSP).
    }

    # ---- Not found ----------------------------------------------------------
    # Only reachable for /media/, /static/ and /assets/. Anything under `/` is
    # caught by `try_files ... /index.html` above and answered by the SPA, so
    # nginx's own 404 appears exactly where a file is genuinely missing: a
    # mistyped media path, or an image whose row still points at a deleted
    # upload. Without this it is nginx's bare page with the server version
    # printed underneath it.
    #
    # `internal` means the page cannot be fetched directly, only reached by
    # nginx handling an error. The file asks the network for nothing, so it
    # renders even while whatever else is broken is still broken.
    error_page 404 /404.html;
    location = /404.html {
        root /opt/clubbooking/backend/templates;
        internal;
    }

    # ---- User-uploaded media ------------------------------------------------
    # Served from a shared volume (Django MEDIA_ROOT). Uploaded files must never
    # be treated as active content - sandbox + a null CSP neutralises a malicious
    # SVG/HTML upload, and nosniff stops content-type confusion.
    location /media/ {
        alias /opt/clubbooking/backend/media/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }

    # ---- Django collected static (admin, Swagger UI assets) -----------------
    location /static/ {
        alias /opt/clubbooking/backend/staticfiles/;
        expires 30d;
        add_header X-Content-Type-Options "nosniff" always;
    }
}

# =============================================================================
# PUBLIC WEBSITE (Astro SSR)  -  www.example.com
# =============================================================================
server {
    listen 80;
    server_name www.example.com example.com;
    return 301 https://www.example.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.example.com example.com;

    ssl_certificate     /etc/ssl/clubbooking/www-fullchain.pem;
    ssl_certificate_key /etc/ssl/clubbooking/www-privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 5m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers for the public site. CSP allows the site's own assets and
    # Google Fonts; it renders admin-authored CMS HTML (sanitised server-side) and
    # a JSON-LD block. Shipped Report-Only - verify, then promote to enforcing.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # ---- Not found ----------------------------------------------------------
    # The Astro node answers its own 404 for everything proxied to it, so this
    # covers /media/ only: an image that has gone would otherwise show nginx's
    # bare page on the customer's own domain.
    error_page 404 /404.html;
    location = /404.html {
        root /opt/clubbooking/backend/templates;
        internal;
    }

    # Catalogue / branding images live in Django MEDIA_ROOT (same box) - serve
    # them directly so the SSR node isn't a hop for static bytes.
    location /media/ {
        alias /opt/clubbooking/backend/media/;
        expires 7d;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }

    # Astro's own hashed client assets are immutable.
    location /_astro/ {
        proxy_pass http://clubbooking_website;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else -> the Astro SSR node.
    location / {
        proxy_pass http://clubbooking_website;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # PINNED, not passed through. nginx forwards any header it does not
        # set itself, so without these a visitor could send their own
        # `X-Forwarded-Host: evil.example` and have the application believe it.
        # That is the way in for host-header reflection, cache poisoning and
        # the SSRF-in-error-rendering class of bug: the app builds a URL from
        # a header the attacker chose. Overriding them costs nothing and closes
        # the whole family whatever the framework does with the value.
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Forwarded-Port   $server_port;
        proxy_set_header Connection        "";
    }
}
